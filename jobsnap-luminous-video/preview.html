            const ctx = ensureAudio(); if (!ctx) return;
            const t = ctx.currentTime;
            const o = ctx.createOscillator(); o.type = "sine";
            o.frequency.setValueAtTime(freq * 0.68, t);
            o.frequency.exponentialRampToValueAtTime(freq * 1.22, t + 0.075);
            const g = ctx.createGain();
            g.gain.setValueAtTime(0.001, t);
            g.gain.linearRampToValueAtTime(vol, t + 0.012);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
            o.connect(g); g.connect(masterGain);
            o.start(t); o.stop(t + 0.13);
          },
          tick(step = 0) {
            const ctx = ensureAudio(); if (!ctx) return;
            const t = ctx.currentTime;
            const o = ctx.createOscillator(); o.type = "sine";
            o.frequency.setValueAtTime(760 + step * 58, t);
            const g = ctx.createGain();
            g.gain.setValueAtTime(0.075, t);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 0.038);
            o.connect(g); g.connect(masterGain);
            o.start(t); o.stop(t + 0.042);
          },
          chime(notes = [523.25, 659.25, 783.99, 1174.66], vol = 0.12, spread = 0.055, decay = 0.95) {
            const ctx = ensureAudio(); if (!ctx) return;
            const now = ctx.currentTime;
            notes.forEach((f, i) => {
              const t = now + i * spread;
              const o = ctx.createOscillator(); o.type = "sine";
              o.frequency.setValueAtTime(f, t);
              const g = ctx.createGain();
              g.gain.setValueAtTime(0.0001, t);
              g.gain.linearRampToValueAtTime(vol, t + 0.018);
              g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
              o.connect(g); g.connect(masterGain);
              o.start(t); o.stop(t + decay + 0.05);
            });
          },
          padChord() {
            const ctx = ensureAudio(); if (!ctx) return;
            const now = ctx.currentTime;
            const flt = ctx.createBiquadFilter(); flt.type = "lowpass"; flt.frequency.value = 1400;
            flt.connect(masterGain);
            [261.63, 392.0, 493.88, 659.25].forEach((f) => {
              const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.setValueAtTime(f, now);
              const g = ctx.createGain();
              g.gain.setValueAtTime(0.0001, now);
              g.gain.linearRampToValueAtTime(0.055, now + 0.45);
              g.gain.exponentialRampToValueAtTime(0.0001, now + 3.1);
              o.connect(g); g.connect(flt);
              o.start(now); o.stop(now + 3.2);
            });
          },
          pulse(beatIdx) {
            const ctx = ensureAudio(); if (!ctx) return;
            const t = ctx.currentTime;
            const chordRoots = [130.81, 146.83, 164.81, 196.0]; /* C3, D3, E3, G3 */
            const root = chordRoots[Math.floor(beatIdx / 8) % chordRoots.length];
            const isDown = beatIdx % 4 === 0;
            /* Soft warm sub-kick on downbeats */
            if (beatIdx % 2 === 0) {
              const k = ctx.createOscillator(); k.type = "sine";
              k.frequency.setValueAtTime(isDown ? 112 : 94, t);
              k.frequency.exponentialRampToValueAtTime(42, t + 0.11);
              const kg = ctx.createGain();
              kg.gain.setValueAtTime(isDown ? 0.14 : 0.07, t);
              kg.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
              k.connect(kg); kg.connect(masterGain);
              k.start(t); k.stop(t + 0.15);
            }
            /* Airy muted synth pluck on off-beats */
            const arp = [root * 2, root * 2.5, root * 3, root * 4];
            const freq = arp[beatIdx % 4];
            const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.setValueAtTime(freq, t);
            const flt = ctx.createBiquadFilter(); flt.type = "lowpass"; flt.frequency.value = 1150;
            const g = ctx.createGain();
            g.gain.setValueAtTime(0.0001, t);
            g.gain.linearRampToValueAtTime(0.036, t + 0.012);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
            o.connect(flt); flt.connect(g); g.connect(masterGain);
            o.start(t); o.stop(t + 0.26);
          }
        };

        /* Frame-accurate cue table synced directly to the real 30s voiceover */
        const CUES = [
          [0.04,  () => SFX.whoosh(0.36, 280, 1200, 0.16)],
          [1.04,  () => SFX.whoosh(0.36, 360, 1450, 0.16)],
          [2.00,  () => SFX.pop(520, 0.14)],
          [2.42,  () => SFX.whoosh(0.42, 260, 1300, 0.18)],
          [3.40,  () => SFX.click(0.36)],
          [3.65,  () => SFX.whoosh(0.48, 220, 1700, 0.20)],
          [4.38,  () => SFX.whoosh(0.48, 180, 980,  0.20)],
          [5.15,  () => SFX.whoosh(0.36, 320, 1250, 0.15)],
          [5.80,  () => SFX.whoosh(0.42, 340, 1400, 0.16)],
          [6.88,  () => SFX.pop(600, 0.14)],
          [8.92,  () => SFX.pop(680, 0.16)],
          [10.70, () => SFX.whoosh(0.56, 240, 2100, 0.26)],
          [11.45, () => SFX.tick(0)], [11.75, () => SFX.tick(1)], [12.05, () => SFX.tick(2)], [12.35, () => SFX.tick(3)],
          [12.65, () => SFX.tick(4)], [12.95, () => SFX.tick(5)], [13.25, () => SFX.tick(6)], [13.55, () => SFX.tick(7)],
          [13.85, () => SFX.tick(8)], [14.15, () => SFX.tick(9)],
          [14.76, () => { SFX.pop(640, 0.18); SFX.chime([523.25, 659.25, 783.99, 1046.5], 0.13, 0.045, 0.95); }],
          [15.82, () => SFX.whoosh(0.45, 260, 1350, 0.18)],
          [16.52, () => SFX.whoosh(0.42, 420, 1050, 0.15)],
          [18.25, () => SFX.click(0.36)],
          [18.58, () => SFX.whoosh(0.48, 300, 1650, 0.20)],
          [19.05, () => SFX.pop(580, 0.15)],
          [21.40, () => SFX.whoosh(0.48, 200, 1150, 0.20)],
          [22.10, () => SFX.click(0.32)],
          [22.40, () => SFX.whoosh(0.38, 320, 1450, 0.16)],
          [22.85, () => SFX.whoosh(0.44, 260, 1200, 0.16)],
          [23.48, () => SFX.click(0.38)],
          [23.60, () => SFX.chime([392.0, 587.33, 783.99], 0.12, 0.055, 0.85)],
          [25.18, () => SFX.chime([659.25, 987.77, 1318.5], 0.10, 0.05, 0.65)],
          [25.52, () => SFX.pop(540, 0.14)],
          [26.12, () => SFX.pop(640, 0.14)],
          [26.68, () => SFX.pop(760, 0.15)],
          [27.50, () => SFX.whoosh(0.52, 260, 1600, 0.18)],
          [27.64, () => { SFX.padChord(); SFX.chime([523.25, 659.25, 987.77], 0.11, 0.07, 1.8); }]
        ];

        let prevT = -1;
        function syncUI() {
          const t = rootTl.time();
          scrub.value = t.toFixed(2);
          tc.textContent = `${t.toFixed(2).padStart(5,"0")} / ${DUR.toFixed(2)}s`;
          btnPlay.textContent = rootTl.paused() ? "Play" : "Pause";
          if (!rootTl.paused() && soundEnabled && prevT >= 0) {
            const dt = t - prevT;
            if (dt > 0 && dt < 0.25) {
              for (const [ct, fn] of CUES) {
                if (prevT < ct && t >= ct) fn();
              }
              /* Gentle 120 BPM preview pulse only when no custom BG music file is loaded */
              if (!bgAudio && t >= 0.25 && t < 27.2) {
                const bPrev = Math.floor(prevT / 0.25);
                const bCurr = Math.floor(t / 0.25);
                if (bCurr > bPrev) SFX.pulse(bCurr);
              }
            }
          }
          /* Auto-duck loaded BG music under voice, swell on jobsnap.me outro, fade out at 32.0s */
          if (bgAudio && !bgAudio.paused) {
            const base = voAudio ? 0.20 : 0.42;
            const outro = voAudio ? 0.42 : 0.48;
            let vol = base;
            if (t < 0.7) vol = base * (t / 0.7);
            else if (t > 28.8 && t < 30.8) vol = base + (outro - base) * clamp((t - 28.8) / 0.8);
            else if (t >= 30.8) vol = outro * clamp((DUR - t) / 1.2);
            bgAudio.volume = clamp(vol, 0, 1);
            if (t >= DUR - 0.04) bgAudio.pause();
          }
          prevT = t;
        }
        gsap.ticker.add(syncUI);
        btnSnd.onclick = () => {
          soundEnabled = !soundEnabled;
          btnSnd.textContent = soundEnabled ? "🔊 Sound ON" : "🔇 Muted";
          btnSnd.classList.toggle("active", soundEnabled);
          if (bgAudio) bgAudio.muted = !soundEnabled;
          if (soundEnabled) { ensureAudio(); SFX.pop(620, 0.12); }
        };
        btnPlay.onclick = () => {
          ensureAudio();
          if (rootTl.time() >= DUR - 0.05) { rootTl.time(0); prevT = -0.01; }
          const nextPaused = !rootTl.paused();
          rootTl.paused(nextPaused);
          if (voAudio) {
            if (nextPaused) voAudio.pause();
            else { voAudio.currentTime = rootTl.time(); voAudio.play().catch(() => {}); }
          }
          if (bgAudio) {
            if (nextPaused) bgAudio.pause();
            else { bgAudio.currentTime = rootTl.time(); bgAudio.play().catch(() => {}); }
          }
          syncUI();
        };
        btnRes.onclick = () => {
          ensureAudio(); prevT = -0.01; rootTl.time(0).play();
          if (voAudio) { voAudio.currentTime = 0; voAudio.play().catch(() => {}); }
          if (bgAudio) { bgAudio.currentTime = 0; bgAudio.play().catch(() => {}); }
          syncUI();
        };
        scrub.oninput = () => {
          const v = parseFloat(scrub.value); prevT = v; rootTl.pause(v);
          if (voAudio) { voAudio.pause(); voAudio.currentTime = Math.min(v, voAudio.duration || v); }
          if (bgAudio) { bgAudio.pause(); bgAudio.currentTime = Math.min(v, bgAudio.duration || v); }
          syncUI();
        };
        document.querySelectorAll("#scene-jumps button").forEach((b) => {
          b.onclick = () => {
            ensureAudio();
            document.querySelectorAll("#scene-jumps button").forEach((x) => x.classList.remove("active"));
            b.classList.add("active");
            const v = parseFloat(b.dataset.t);
            prevT = v;
            rootTl.pause(v);
            if (voAudio) { voAudio.pause(); voAudio.currentTime = Math.min(v, voAudio.duration || v); }
            if (bgAudio) { bgAudio.pause(); bgAudio.currentTime = Math.min(v, bgAudio.duration || v); }
            syncUI();
          };
        });
        window.addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); btnPlay.click(); } });
        /* Unlock audio automatically on first user click anywhere on page */
        window.addEventListener("pointerdown", () => { if (soundEnabled) ensureAudio(); }, { once: true });
        rootTl.play(0);
      }

      const ready = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
      Promise.all([
        ready,
        document.fonts.load('400 72px "Plus Jakarta Sans"'),
        document.fonts.load('500 84px "Plus Jakarta Sans"'),
        document.fonts.load('600 40px "Plus Jakarta Sans"'),
        document.fonts.load('500 24px "JetBrains Mono"')
      ]).then(buildFilm, buildFilm);
    </script>
  </body>
</html>
