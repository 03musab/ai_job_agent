<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{W}}, height={{H}}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
{{AE_MOTION}}
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: {{W}}px; height: {{H}}px; overflow: hidden; background: #F8FAFF; }
      #root { position: relative; width: {{W}}px; height: {{H}}px; overflow: hidden; background: #F8FAFF; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-iekx" id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="{{W}}" data-height="{{H}}">
      <div data-hf-id="hf-rt4w" id="film" data-composition-id="film" data-composition-src="compositions/film.html" data-start="0" data-duration="{{DUR}}" data-track-index="1" data-track-kind="graphics" data-width="{{W}}" data-height="{{H}}"></div>
{{AUDIO}}
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
