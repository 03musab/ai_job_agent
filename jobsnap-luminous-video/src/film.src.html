  <script>
    (function () {
      /*__DATA__*/
      const $ = (s) => document.querySelector(s);
      const NS = "http://www.w3.org/2000/svg";
      const VW = SIZE[0], VH = SIZE[1];

      function build() {
        const rootTl = gsap.timeline({ paused: true });
        const tl = gsap.timeline();
        rootTl.add(tl, 0);

        const W = WORDS.map((q) => q[1]);

        const ticks = [];
        const P0 = (t) => Math.max(0, t);
        const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
        const hash = (n) => {
          let q = Math.imul((n | 0) ^ 0x9e3779b9, 0x85ebca6b);
          q ^= q >>> 13; q = Math.imul(q, 0xc2b2ae35); q ^= q >>> 16;
          return (q >>> 0) / 4294967296;

        const mk = (parent, cls = "abs", css = "", html = "") => {

        const svgEl = (parent, x, y, w, h, inner) => {

        const SC = {};
        function scene(id, t0, t1) {
          const e = mk($("#f-scenes"), "sc");

          tl.set(e, { display: "block" }, P0(t0));

          /* 3: 6.00–10.65s -Electric Magenta, Warm Gold, Deep Teal & Violet Aurora ("Jobs, match scores... all in one platform") */
          { at: 6.00, dur: 0.52, css: "background: radial-gradient(ellipse 62% 72% at 15% 45%, #EC4899 0%, rgba(236,72,153,0.65) 42%, transparent 72%), radial-gradient(ellipse 44% 78% at 38% 36%, #F59E0B 0%, rgba(251,191,36,0.5) 36%, transparent 66%), radial-gradient(ellipse 56% 74% at 62% 68%, #0F766E 0%, rgba(13,148,136,0.75) 45%, transparent 74%), radial-gradient(ellipse 64% 76% at 88% 72%, #7C3AED 0%, #4C1D95 55%, #1E1B4B 100%); background-color:#130F26;" },
          /* 4: 10.65–14.65s -Deep Cobalt-Sapphire & Luminous Cyan-Emerald Ocean ("Our AI scans live roles and scores your fit in seconds") */
          { at: 10.65, dur: 0.48, css: "background: radial-gradient(ellipse 62% 68% at 20% 42%, #2563EB 0%, rgba(37,99,235,0.45) 44%, transparent 74%), radial-gradient(ellipse 60% 66% at 84% 58%, #059669 0%, rgba(16,185,129,0.42) 42%, transparent 72%), radial-gradient(ellipse 55% 55% at 54% 18%, rgba(56,189,248,0.34) 0%, transparent 68%), #070B19;" },

          { at: 14.65, dur: 0.36, css: "background: radial-gradient(ellipse 64% 64% at 22% 24%, #6EE7B7 0%, rgba(110,231,183,0.4) 44%, transparent 74%), radial-gradient(ellipse 64% 64% at 82% 76%, #FDBA74 0%, rgba(253,186,116,0.42) 44%, transparent 74%), radial-gradient(ellipse 70% 70% at 50% 50%, #F0F9FF 0%, #E0F2FE 65%, #ECFEFF 100%);" },
          /* 6: 15.80–18.55s -Luminous Periwinkle-Violet & Aqua Cloud Wash ("Every matched role across LinkedIn, Naukri, and direct portals") */
          { at: 15.80, dur: 0.45, css: "background: radial-gradient(ellipse 68% 68% at 16% 20%, #A5B4FC 0%, rgba(165,180,252,0.45) 42%, transparent 72%), radial-gradient(ellipse 62% 64% at 86% 80%, #99F6E4 0%, rgba(153,246,228,0.48) 42%, transparent 72%), linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 52%, #F0FDFA 100%);" },

          { at: 21.35, dur: 0.48, css: "background: radial-gradient(ellipse 66% 58% at 78% 28%, rgba(16,185,129,0.52) 0%, rgba(16,185,129,0.16) 46%, transparent 74%), radial-gradient(ellipse 68% 62% at 22% 76%, rgba(99,102,241,0.56) 0%, rgba(79,70,229,0.18) 48%, transparent 74%), #070A13;" },
          /* 9: 25.15–27.45s -Sculptural Noir Spotlight & Electric Sky Glow ("Match. Fill. Land.") */

          { at: 27.45, dur: 0.55, css: "background: radial-gradient(ellipse 58% 60% at 14% 20%, rgba(253,186,116,0.55) 0%, transparent 68%), radial-gradient(ellipse 58% 60% at 88% 82%, rgba(110,231,183,0.52) 0%, transparent 68%), radial-gradient(ellipse 64% 64% at 82% 18%, rgba(196,181,253,0.42) 0%, transparent 68%), #FAF8FF;" }

        /* Fade older layers out cleanly once covered so compositing stays crisp & fast */
        for (let i = 0; i < bgEls.length - 1; i++) {
          const next = BG_THEMES[i + 1];
          tl.set(bgEls[i], { opacity: 0 }, P0(next.at + next.dur + 0.04));

        ticks.push((T) => {
          const dx = Math.sin(T * 0.45) * 32;
          const dy = Math.cos(T * 0.36) * 24;
          const sc = 1.03 + Math.sin(T * 0.28) * 0.025;
          for (let i = 0; i < bgEls.length; i++) {
            bgEls[i].style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px) scale(${sc.toFixed(3)})`;

        /* Signature Zelios airy blur-in & blur-out moves */
        const blurIn = (el, t, d = 0.45, o = {}) =>
          tl.fromTo(
            el,

        const blurOut = (el, t, d = 0.34, o = {}) =>

        function stroke(p, t, d = 0.52, ease = "power2.inOut") {
          const L = (p.getTotalLength ? p.getTotalLength() : 600) + 2;
          gsap.set(p, { opacity: 0, attr: { "stroke-dasharray": L, "stroke-dashoffset": L } });
          tl.set(p, { opacity: 1 }, P0(t));
          tl.to(p, { attr: { "stroke-dashoffset": 0 }, duration: d, ease }, P0(t));
          return p;
        }

        function counter(el, from, to, t0, dur, fmt) {
          const fn = gsap.parseEase("power2.out");
          ticks.push((T) => {
            if (T < t0) { el.textContent = fmt(from); return; }
            el.textContent = fmt(from + (to - from) * fn(clamp((T - t0) / Math.max(0.01, dur))));

        }

        /* Crisp macOS hand pointer SVG + click ripple helper */
        const HAND_SVG = `<svg viewBox="0 0 64 64" width="60" height="60" xmlns="http://www.w3.org/2000/svg">
          <path d="M24 10 C24 7 29 7 29 10 L29 26 L31 26 C31 23 36 23 36 26 L36 28 L38 28 C38 25 43 25 43 28 L43 31 L45 31 C45 28 50 28 50 32 L50 43 C50 52 43 57 34 57 C25 57 20 51 16 44 L11 35 C9 32 13 28 17 31 L24 36 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="3.2" stroke-linejoin="round"/>
          <line x1="29" y1="32" x2="29" y2="45" stroke="#0F172A" stroke-width="2.4" stroke-linecap="round"/>
          <line x1="36" y1="33" x2="36" y2="45" stroke="#0F172A" stroke-width="2.4" stroke-linecap="round"/>
          <line x1="43" y1="35" x2="43" y2="45" stroke="#0F172A" stroke-width="2.4" stroke-linecap="round"/>

          const cur = mk(parent, "hand-cur", `left:${fromX}px; top:${fromY}px; opacity:0;`, HAND_SVG);
          const ring = mk(parent, "click-ring", `left:${toX - 4}px; top:${toY - 12}px; opacity:0;`);
          gsap.set(ring, { opacity: 0, scale: 0.35 });
          tl.to(cur, { opacity: 1, duration: 0.22 }, P0(arriveAt));
          tl.to(cur, { left: toX, top: toY, duration: Math.max(0.25, clickAt - arriveAt), ease: "power3.inOut" }, P0(arriveAt));
          tl.to(cur, { scale: 0.84, duration: 0.11, ease: "power2.in" }, P0(clickAt));
          tl.to(cur, { scale: 1.0, duration: 0.18, ease: "back.out(2)" }, P0(clickAt + 0.11));
          tl.fromTo(ring, { scale: 0.4, opacity: 0.85 }, { scale: 1.8, opacity: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, P0(clickAt + 0.04));
          if (exitAt != null) tl.to(cur, { opacity: 0, y: 24, duration: 0.24 }, P0(exitAt));

        }

        let _svgUid = 0;

          return `

                <stop offset="100%" stop-color="#047857"/>
              </linearGradient>
            </defs>
            <rect width="120" height="120" rx="28" fill="url(#${gid})"/>
            <polygon points="68.4,22.2 34.8,67.8 58.8,67.8 51.6,103.8 85.2,58.2 61.2,58.2" fill="#022c22" opacity="0.18"/>
            <polygon points="68.4,19.2 34.8,64.8 58.8,64.8 51.6,100.8 85.2,55.2 61.2,55.2" fill="#ffffff"/>
          </svg>`;
        };

        /* 4-point luminous sparkle SVG (unique gradient ID per instance) */
        const SPARKLE_SVG = (size = 96) => {
          const sid = "spGrad_" + (++_svgUid);
          return `
          <svg viewBox="0 0 100 100" width="${size}" height="${size}" style="display:block;overflow:visible;">
            <defs>
              <linearGradient id="${sid}" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#60A5FA"/>
                <stop offset="55%" stop-color="#3B82F6"/>
                <stop offset="100%" stop-color="#10B981"/>
              </linearGradient>
            </defs>
            <path d="M50 4 C54 34, 66 46, 96 50 C66 54, 54 66, 50 96 C46 66, 34 54, 4 50 C34 46, 46 34, 50 4 Z" fill="url(#${sid})" />
          </svg>`;
        };

        /*__SCENES__*/

        const clock = { _t: 0 };
        Object.defineProperty(clock, "t", {
          get() { return this._t; },
          set(v) { this._t = v; for (const f of ticks) f(v); }
        });
        rootTl.to(clock, { t: DUR, duration: DUR, ease: "none" }, 0);
        for (const f of ticks) f(0);

        window.__timelines = window.__timelines || {};
        window.__timelines["film"] = rootTl;
      }

      const ready = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
      Promise.all([
        ready,
        document.fonts.load('400 72px "Plus Jakarta Sans"'),
        document.fonts.load('500 84px "Plus Jakarta Sans"'),
        document.fonts.load('600 40px "Plus Jakarta Sans"'),
        document.fonts.load('500 24px "JetBrains Mono"')
      ]).then(build, build);
    })();
