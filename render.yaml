services:
  # 1. Main Web Application (Runs Gunicorn + Celery Background Worker & Beat Scheduler)
  - type: web
    name: ai-jobsnap-web
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "bash start.sh"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MALLOC_ARENA_MAX
        value: 2
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-jobsnap-db
          property: connectionString
      - key: REQUIRE_POSTGRES
        value: "true"
      - key: DATABASE_MIGRATION_COMPLETE
        value: "false"
      - key: ADMIN_USERNAMES
        sync: false
      - key: PUBLIC_APP_URL
        value: "https://app.jobsnap.me"
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ai-jobsnap-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false

  # 2. Managed Key Value (Valkey / Redis) Queue Broker
  - type: keyvalue
    name: ai-jobsnap-redis
    plan: free
    ipAllowList: [] # internal private access only

databases:
  - name: ai-jobsnap-db
    databaseName: ai_jobsnap
    user: ai_jobsnap
    plan: basic-256mb
