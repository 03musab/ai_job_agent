services:
  # 1. Main Web Application (Runs Gunicorn + Celery Background Worker & Beat Scheduler)
  - type: web
    name: ai-jobsnap-web
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "bash start.sh"
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ai-jobsnap-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false

  # 2. Managed Key Value (Valkey / Redis) Queue Broker
  - type: keyvalue
    name: ai-jobsnap-redis
    plan: free
    ipAllowList: [] # internal private access only
