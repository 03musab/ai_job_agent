{% extends "base.html" %}
{% block title %}Post a New Job - JobSnap{% endblock %}
{% block body_class %}light-theme{% endblock %}
{% block content %}

<div class="page-header">
    <h1 class="page-title">Post a New Job</h1>
</div>

<div class="card max-w-4xl mx-auto">
    <form id="post-job-form">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div class="form-group">
                <label for="title" class="form-label">Job Title *</label>
                <input type="text" name="title" id="title" required class="form-input">
            </div>
            <div class="form-group">
                <label for="company" class="form-label">Company Name *</label>
                <input type="text" name="company" id="company" required value="{{ company_name }}" class="form-input">
            </div>
            <div class="form-group">
                <label for="location" class="form-label">Location *</label>
                <input type="text" name="location" id="location" required placeholder="e.g., San Francisco, CA or Remote" class="form-input">
            </div>
            <div class="form-group">
                <label for="job_type" class="form-label">Job Type *</label>
                <select id="job_type" name="job_type" required class="form-select">
                    <option>Full-time</option>
                    <option>Part-time</option>
                    <option>Contract</option>
                    <option>Internship</option>
                    <option>Temporary</option>
                </select>
            </div>
            <div class="form-group">
                <label for="salary_range" class="form-label">Salary Range (Optional)</label>
                <input type="text" name="salary_range" id="salary_range" placeholder="e.g., $100,000 - $120,000" class="form-input">
            </div>
            <div class="form-group">
                <label for="deadline" class="form-label">Application Deadline (Optional)</label>
                <input type="date" name="deadline" id="deadline" class="form-input">
            </div>
        </div>

        <div class="form-group">
            <label for="description" class="form-label">Job Description *</label>
            <textarea id="description" name="description" rows="8" required class="form-textarea"></textarea>
        </div>

        <div class="form-group">
            <label for="skills" class="form-label">Required Skills (comma-separated)</label>
            <input type="text" name="skills" id="skills" placeholder="e.g., Python, React, SQL" class="form-input">
        </div>

        <div class="pt-card mt-card border-t flex justify-end"
             :class="darkMode ? 'border-gray-700' : 'border-gray-200'">
            <button type="submit" class="btn btn-primary">Post Job</button>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('post-job-form');
    form.addEventListener('submit', function (e) {
        e.preventDefault();
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        if (data.skills) {
            data.skills = data.skills.split(',').map(s => s.trim()).filter(s => s);
        } else {
            data.skills = [];
        }
        fetch('/api/jobs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(response => {
            if (!response.ok) {
                return response.json().then(err => { throw new Error(err.error || 'An unknown error occurred.') });
            }
            return response.json();
        })
        .then(result => {
            window.location.href = '/recruiter/dashboard?flash_success=Job posted successfully!';
        })
        .catch(error => {
            alert('Error: ' + error.message);
        });
    });
});
</script>
{% endblock %}
