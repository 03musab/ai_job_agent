<!-- Top Job Picks for You — 3D Fan Carousel (Stitch Spec) -->
{% if current_user.role != 'recruiter' %}
{% if top_picks %}
<script type="application/json" id="picks-json-data">{{ top_picks | tojson }}</script>
<script id="picks-data">
    var __topPicksRaw = [];
    try {
        __topPicksRaw = JSON.parse(document.getElementById('picks-json-data').textContent);
    } catch (e) { }
    window.__topPicks__ = __topPicksRaw;
</script>
<style>
    .fan-stage {
        perspective: 1000px;
        perspective-origin: center center;
    }
    .fan-card {
        transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease, z-index 0s;
        transform-style: preserve-3d;
        cursor: pointer;
        will-change: transform;
        user-select: none;
    }
    .fan-card:hover {
        filter: brightness(1.05);
    }
    .fan-dot {
        transition: all 0.3s ease;
    }
</style>
<div class="mb-6 border border-outline-variant rounded-lg p-4 bg-surface-container-low" x-data="fanCarousel(window.__topPicks__)">
    <!-- Header -->
    <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-[18px] text-tertiary">star</span>
            <div>
                <h2 class="font-headline-md text-[14px] text-on-surface font-semibold">Top Job Picks For You</h2>
                <p class="font-data-mono text-[10px] text-on-surface-variant uppercase tracking-widest">Resume Skill Matched</p>
            </div>
        </div>
        <div class="flex items-center gap-1">
            <button @click="prev()" :disabled="activeIndex === 0"
                class="p-1 rounded border border-outline-variant/60 bg-surface-container text-on-surface-variant hover:text-primary hover:border-primary transition-colors disabled:opacity-30 disabled:cursor-not-allowed">
                <span class="material-symbols-outlined text-[16px]">chevron_left</span>
            </button>
            <button @click="next()" :disabled="activeIndex === picks.length - 1"
                class="p-1 rounded border border-outline-variant/60 bg-surface-container text-on-surface-variant hover:text-primary hover:border-primary transition-colors disabled:opacity-30 disabled:cursor-not-allowed">
                <span class="material-symbols-outlined text-[16px]">chevron_right</span>
            </button>
        </div>
    </div>

    <!-- 3D Fan Stage -->
    <div class="fan-stage relative w-full overflow-hidden" style="height: 280px;">
        <template x-for="(pick, i) in picks" :key="i">
            <div class="fan-card absolute" :style="getCardStyle(i)" @click="setActive(i)">
                <!-- Card face -->
                <div class="border rounded-lg flex flex-col overflow-hidden transition-all duration-300 bg-surface-container"
                     :class="i === activeIndex ? 'border-primary shadow-xl ring-1 ring-primary/40' : 'border-outline-variant shadow-md'"
                     style="width: 240px; height: 260px;">
                    <div class="p-4 flex-1 flex flex-col">
                        <div class="flex items-center justify-between mb-2">
                            <span class="font-data-mono text-[10px] px-1.5 py-0.5 rounded border border-outline-variant bg-surface-container-high text-on-surface-variant"
                                  x-text="pick.status_text"></span>
                            <span x-show="pick.relevance_score > 0"
                                  class="font-data-mono text-[11px] font-bold text-secondary px-1.5 py-0.5 rounded bg-secondary/10 border border-secondary/20"
                                  x-text="Math.min(Math.round(pick.relevance_score), 100) + '%'"></span>
                        </div>
                        <h3 class="font-body-sm font-semibold text-on-surface text-[13px] leading-snug line-clamp-2"
                            x-text="pick.title"></h3>
                        <p class="font-data-mono text-[11px] text-on-surface-variant mt-1"
                            x-text="pick.company"></p>
                        <div class="flex flex-wrap gap-1 mt-auto pt-2">
                            <template x-for="skill in pick.matched_skills.slice(0,3)" :key="skill">
                                <span class="font-data-mono text-[9px] px-1.5 py-0.5 rounded bg-surface-container-high text-on-surface-variant border border-outline-variant/30"
                                      x-text="skill"></span>
                            </template>
                        </div>
                    </div>
                    <!-- View Details on active -->
                    <div class="px-3 pb-3 pt-1" x-show="i === activeIndex" x-transition>
                        <a :href="'/job/' + pick.id"
                            class="w-full bg-primary text-on-primary font-label-caps text-label-caps py-1.5 rounded flex items-center justify-center hover:bg-primary-container transition-colors"
                            @click.stop>
                            View Details
                        </a>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <!-- Dot indicators -->
    <div class="flex justify-center gap-1 mt-3">
        <template x-for="(pick, i) in picks" :key="i">
            <button @click="setActive(i)" class="fan-dot rounded-full transition-all"
                :class="i === activeIndex ? 'w-4 h-1.5 bg-primary' : 'w-1.5 h-1.5 bg-outline-variant hover:bg-outline'">
            </button>
        </template>
    </div>
</div>

<script>
    function fanCarousel(picks) {
        return {
            picks,
            activeIndex: Math.floor(picks.length / 2),
            prev() { if (this.activeIndex > 0) this.activeIndex--; },
            next() { if (this.activeIndex < this.picks.length - 1) this.activeIndex++; },
            setActive(i) { this.activeIndex = i; },
            getCardStyle(i) {
                const diff = i - this.activeIndex;
                const abs = Math.abs(diff);
                const stageW = 800;
                const cardW = 240;
                const offsetMap = { 0: 0, 1: 180, 2: 300, 3: 380, 4: 440 };
                const xOff = (offsetMap[abs] || abs * 110) * Math.sign(diff);
                const rotateMap = { 0: 0, 1: 25, 2: 40, 3: 50, 4: 58 };
                const rotY = -(rotateMap[abs] || 55) * Math.sign(diff);
                const scaleMap = { 0: 1, 1: 0.82, 2: 0.68, 3: 0.58, 4: 0.5 };
                const scale = scaleMap[abs] || 0.45;
                const opacityMap = { 0: 1, 1: 0.85, 2: 0.65, 3: 0.45, 4: 0.3 };
                const opacity = opacityMap[abs] || 0.25;
                const zIndex = 50 - abs * 10;

                return `
                    left: calc(50% - ${cardW / 2}px + ${xOff}px);
                    top: ${abs === 0 ? 10 : 25}px;
                    transform: rotateY(${rotY}deg) scale(${scale});
                    opacity: ${opacity};
                    z-index: ${zIndex};
                    transform-origin: center center;
                `;
            }
        };
    }
</script>
{% endif %}
{% endif %}
