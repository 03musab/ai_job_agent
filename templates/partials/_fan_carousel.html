<!-- Top Job Picks for You — 3D Fan Carousel -->
{% if current_user.role != 'recruiter' %}
{% if top_picks %}
<script type="application/json" id="picks-json-data">{{ top_picks | tojson }}</script>
<script id="picks-data">
    var __topPicksRaw = [];
    try {
        __topPicksRaw = JSON.parse(document.getElementById('picks-json-data').textContent);
    } catch (e) { }
    window.__topPicks__ = __topPicksRaw;
</script>
<style>
    .fan-stage {
        perspective: 1000px;
        perspective-origin: center center;
    }
    .fan-card {
        transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease, z-index 0s;
        transform-style: preserve-3d;
        cursor: pointer;
        will-change: transform;
        user-select: none;
    }
    .fan-card:hover {
        filter: brightness(1.03);
    }
    .fan-dot {
        transition: all 0.3s ease;
    }
</style>
<div class="mb-10" x-data="fanCarousel(window.__topPicks__)">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-3">
            <span aria-hidden="true"><svg class="w-7 h-7 text-amber-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.006 5.404.434c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.434 2.082-5.005Z" clip-rule="evenodd" /></svg></span>
            <div>
                <h2 class="text-xl font-bold text-gray-900">Top Job Picks for You</h2>
                <p class="text-xs text-gray-500">Based on your resume skills</p>
            </div>
        </div>
    </div>

    <!-- 3D Fan Stage -->
    <div class="fan-stage relative w-full overflow-hidden" style="height: 320px;">
        <template x-for="(pick, i) in picks" :key="i">
            <div class="fan-card absolute" :style="getCardStyle(i)" @click="setActive(i)">
                <!-- Card face -->
                <div class="border flex flex-col overflow-hidden transition-all duration-300" :class="[
                        i === activeIndex ? (darkMode ? 'border-premium-ruby shadow-premium-ruby/30' : 'border-indigo-300 shadow-2xl') : (darkMode ? 'border-premium-teal/40 shadow-md' : 'border-gray-200 shadow-md'),
                        darkMode ? 'bg-[var(--card-bg)]' : 'bg-white'
                    ]" style="width: 240px; height: 280px;">
                    <!-- Gradient header -->
                    <div class="p-5 flex-1 flex flex-col"
                        :style="i === activeIndex ? (darkMode ? 'background: linear-gradient(135deg, rgba(130, 38, 89, 0.1) 0%, rgba(0, 77, 97, 0.1) 100%)' : 'background: linear-gradient(135deg, #f0f4ff 0%, #fafaff 100%)') : ''">
                        <div class="flex items-center justify-between mb-3">
                            <span
                                class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold"
                                :style="'background-color:' + pick.status_color + '; color:' + pick.status_text_color"
                                x-text="pick.status_text"></span>
                            <span x-show="pick.relevance_score > 0"
                                class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full"
                                x-text="Math.round(pick.relevance_score) + '%'"></span>
                        </div>
                        <h3 class="text-base font-bold mb-1 leading-snug"
                            :class="darkMode ? 'text-premium-text' : 'text-gray-900'"
                            style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em"
                            x-text="pick.title"></h3>
                        <p class="text-sm truncate mb-3"
                            :class="darkMode ? 'text-premium-text/70' : 'text-gray-500'"
                            x-text="pick.company"></p>
                        <div class="flex flex-wrap gap-1 mt-auto">
                            <template x-for="skill in pick.matched_skills.slice(0,4)" :key="skill">
                                <span
                                    class="inline-block px-2 py-0.5 text-xs font-medium rounded-full border"
                                    :class="darkMode ? 'bg-premium-ruby/20 text-premium-text border-premium-ruby/30' : 'bg-indigo-50 text-indigo-700 border-indigo-100'"
                                    x-text="skill"></span>
                            </template>
                        </div>
                    </div>
                    <!-- View Details — only on active -->
                    <div class="px-4 pb-4 pt-1" x-show="i === activeIndex" x-transition>
                        <a :href="'/job/' + pick.id"
                            class="w-full btn-temporal inline-flex items-center justify-center px-4 py-2.5 text-sm font-semibold rounded-xl shadow-sm transition-all duration-200"
                            @click.stop>
                            View Details
                        </a>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <!-- Dot indicators -->
    <div class="flex justify-center gap-1.5 mt-8 mb-4">
        <template x-for="(pick, i) in picks" :key="i">
            <button @click="setActive(i)" class="fan-dot rounded-full transition-all duration-300"
                :class="i === activeIndex ? 'w-6 h-2 bg-premium-ruby' : (darkMode ? 'w-2 h-2 bg-premium-teal hover:bg-premium-ruby' : 'w-2 h-2 bg-gray-300 hover:bg-gray-400')">
            </button>
        </template>
    </div>

    <!-- Navigation Controls Below -->
    <div class="flex justify-center items-center gap-4">
        <button @click="prev()" :disabled="activeIndex === 0"
            :class="activeIndex > 0 ? 'bg-white text-gray-700 hover:bg-gray-100 border-gray-300 shadow-sm' : 'bg-gray-100 text-gray-300 border-gray-200 cursor-not-allowed'"
            class="w-10 h-10 flex items-center justify-center rounded-full border transition-all duration-200">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
        </button>
        <button @click="next()" :disabled="activeIndex === picks.length - 1"
            :class="activeIndex < picks.length - 1 ? 'bg-white text-gray-700 hover:bg-gray-100 border-gray-300 shadow-sm' : 'bg-gray-100 text-gray-300 border-gray-200 cursor-not-allowed'"
            class="w-10 h-10 flex items-center justify-center rounded-full border transition-all duration-200">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
        </button>
    </div>
</div>

<script>
    function fanCarousel(picks) {
        return {
            picks,
            activeIndex: Math.floor(picks.length / 2),
            prev() { if (this.activeIndex > 0) this.activeIndex--; },
            next() { if (this.activeIndex < this.picks.length - 1) this.activeIndex++; },
            setActive(i) { this.activeIndex = i; },
            getCardStyle(i) {
                const diff = i - this.activeIndex;
                const abs = Math.abs(diff);
                const stageW = 800;
                const cardW = 240;
                const centerX = stageW / 2 - cardW / 2;

                const offsetMap = { 0: 0, 1: 200, 2: 320, 3: 400, 4: 460 };
                const xOff = (offsetMap[abs] || abs * 120) * Math.sign(diff);

                const rotateMap = { 0: 0, 1: 30, 2: 45, 3: 55, 4: 62 };
                const rotY = -(rotateMap[abs] || 60) * Math.sign(diff);

                const scaleMap = { 0: 1, 1: 0.78, 2: 0.65, 3: 0.55, 4: 0.48 };
                const scale = scaleMap[abs] || 0.44;

                const opacityMap = { 0: 1, 1: 0.85, 2: 0.65, 3: 0.45, 4: 0.3 };
                const opacity = opacityMap[abs] || 0.25;

                const zIndex = 50 - abs * 10;

                return `
                    left: calc(50% - ${cardW / 2}px + ${xOff}px);
                    top: ${abs === 0 ? 20 : 40}px;
                    transform: rotateY(${rotY}deg) scale(${scale});
                    opacity: ${opacity};
                    z-index: ${zIndex};
                    transform-origin: center center;
                `;
            }
        };
    }
</script>
{% endif %}
{% endif %}
