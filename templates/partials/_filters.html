<!-- Streamlined Control Bar (_filters.html) -->
{% if current_user.role != 'recruiter' %}
<div class="border border-outline-variant rounded-lg p-3 bg-surface-container mb-4">
    <form id="filter-form" action="{{ url_for('dashboard') }}" method="GET" class="flex flex-col lg:flex-row items-center gap-2.5">
        
        <!-- Search Keywords -->
        <div class="relative flex-1 w-full">
            <span class="material-symbols-outlined absolute left-2.5 top-1/2 -translate-y-1/2 text-on-surface-variant text-[16px]">search</span>
            <input type="text" id="search_query" name="search_query" placeholder="Filter jobs by title, company, skills..."
                class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded pl-8 pr-3 py-1.5 text-body-sm text-on-surface placeholder:text-on-surface-variant/40 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors"
                value="{{ search_query }}">
        </div>

        <!-- Location Filter -->
        <div class="w-full lg:w-44">
            <input type="text" id="location_filter" name="location_filter" placeholder="Location..."
                class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded px-2.5 py-1.5 text-body-sm text-on-surface placeholder:text-on-surface-variant/40 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors"
                value="{{ location_filter }}">
        </div>

        <!-- Status Filter -->
        <div class="w-full lg:w-36">
            <select id="status_filter" name="status_filter"
                class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded px-2.5 py-1.5 text-body-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors">
                <option value="">All Statuses</option>
                <option value="new" {% if status_filter=='new' %}selected{% endif %}>New</option>
                <option value="pipeline" {% if status_filter=='pipeline' %}selected{% endif %}>Pipeline (Applied & Interview)</option>
                <option value="applied" {% if status_filter=='applied' %}selected{% endif %}>Applied</option>
                <option value="interview" {% if status_filter=='interview' %}selected{% endif %}>Interview</option>
                <option value="offered" {% if status_filter=='offered' %}selected{% endif %}>Offered</option>
                <option value="rejected" {% if status_filter=='rejected' %}selected{% endif %}>Rejected</option>
                <option value="archived" {% if status_filter=='archived' %}selected{% endif %}>Archived</option>
            </select>
        </div>

        <!-- Sort By -->
        <div class="w-full lg:w-36">
            <select id="sort_by" name="sort_by"
                class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded px-2.5 py-1.5 text-body-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors">
                <option value="relevance_score" {% if sort_by=='relevance_score' %}selected{% endif %}>Relevance</option>
                <option value="found_date" {% if sort_by=='found_date' %}selected{% endif %}>Date Added</option>
                <option value="title" {% if sort_by=='title' %}selected{% endif %}>Title</option>
            </select>
        </div>

        <input type="hidden" name="sort_order" value="{{ sort_order }}">

        <!-- Filter Actions -->
        <div class="flex items-center gap-1.5 w-full lg:w-auto shrink-0">
            <button type="submit"
                class="flex-1 lg:flex-none px-3 py-1.5 bg-primary text-on-primary font-label-caps text-label-caps rounded hover:bg-primary-container transition-colors">
                Filter
            </button>
            <a href="{{ url_for('dashboard') }}"
                class="flex-1 lg:flex-none px-3 py-1.5 border border-outline-variant text-on-surface-variant font-label-caps text-label-caps rounded hover:bg-surface-container-high hover:text-on-surface transition-colors text-center">
                Reset
            </a>
        </div>
    </form>
</div>
{% endif %}
