<!-- Clean Master Search & Filter Bar (_filters.html) -->
{% if current_user.role != 'recruiter' %}
<div class="w-full space-y-3" x-data="{ showFilters: false }">
    
    <!-- Primary Single Search & Action Strip -->
    <form id="filter-form" action="{{ url_for('dashboard') }}" method="GET" class="space-y-3">
        <div class="flex flex-col md:flex-row items-stretch gap-2.5 w-full">
            
            <!-- Unified Keyword Search -->
            <div class="relative flex-1">
                <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant/50 text-[18px]">search</span>
                <input type="text" id="search_query" name="search_query" placeholder="Search by role, skill, or company (e.g. Python, React, AI)..."
                    class="w-full bg-surface border border-outline-variant rounded-xl pl-10 pr-4 py-2.5 text-[13.5px] text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all shadow-2xs"
                    value="{{ search_query }}">
            </div>

            <!-- Location Input -->
            <div class="relative w-full md:w-52">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50 text-[17px]">location_on</span>
                <input type="text" id="location_filter" name="location_filter" placeholder="Location or Remote"
                    class="w-full bg-surface border border-outline-variant rounded-xl pl-9 pr-3 py-2.5 text-[13.5px] text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all shadow-2xs"
                    value="{{ location_filter }}">
            </div>

            <!-- Action Buttons: Search, Filters, and Live Scan -->
            <div class="grid grid-cols-3 sm:flex items-center gap-2 shrink-0 w-full md:w-auto">
                <!-- Search Button -->
                <button type="submit"
                    class="px-3 sm:px-4 py-2.5 min-h-[42px] sm:min-h-0 bg-primary text-on-primary font-semibold text-[12px] sm:text-[12.5px] rounded-xl hover:bg-emerald-600 transition-all flex items-center justify-center gap-1 sm:gap-1.5 shadow-xs cursor-pointer">
                    <span class="material-symbols-outlined text-[16px]">search</span>
                    <span>Search</span>
                </button>

                <!-- Filters Drawer Toggle -->
                <button id="seeker-filters-btn" type="button" @click="showFilters = !showFilters"
                    :class="showFilters ? 'border-primary text-primary bg-primary/10' : 'border-outline-variant text-on-surface-variant hover:text-on-surface bg-surface'"
                    class="px-2.5 sm:px-3.5 py-2.5 min-h-[42px] sm:min-h-0 border rounded-xl text-[12px] sm:text-[12.5px] font-medium transition-all flex items-center justify-center gap-1 sm:gap-1.5 cursor-pointer shadow-2xs">
                    <span class="material-symbols-outlined text-[16px]">tune</span>
                    <span>Filters</span>
                    {% if (experience_filter and experience_filter != 'all') or (job_type_filter and job_type_filter != 'all') or (salary_filter and salary_filter != 'all') or (sort_by and sort_by != 'found_date') %}
                    <span class="w-2 h-2 rounded-full bg-primary"></span>
                    {% endif %}
                </button>

                <!-- Live Scan Scraper Action -->
                <button id="seeker-live-scan-btn" type="button" onclick="startScanWithMode('fast')"
                    class="px-2.5 sm:px-3.5 py-2.5 min-h-[42px] sm:min-h-0 border border-outline-variant text-on-surface-variant hover:border-primary hover:text-primary bg-surface rounded-xl text-[12px] sm:text-[12.5px] font-medium transition-all flex items-center justify-center gap-1 sm:gap-1.5 cursor-pointer shadow-2xs whitespace-nowrap"
                    title="Run live automated web scraper to fetch fresh job openings">
                    <span class="material-symbols-outlined text-[16px] text-primary">bolt</span>
                    <span>Live Scan</span>
                </button>
            </div>
        </div>

        <!-- Hidden inputs for active status filter -->
        <input type="hidden" name="status_filter" id="status_filter" value="{{ status_filter or 'all' }}">
        <input type="hidden" name="sort_order" id="sort_order" value="{{ sort_order or 'DESC' }}">

        <!-- Collapsible Secondary Filters Drawer (Only visible on demand) -->
        <div x-show="showFilters" x-transition x-cloak class="border border-outline-variant rounded-2xl p-4 bg-surface shadow-xs space-y-3.5">
            <div class="flex items-center justify-between pb-2 border-b border-outline-variant/60">
                <div class="flex items-center gap-1.5 text-on-surface text-[13px] font-bold">
                    <span class="material-symbols-outlined text-[16px] text-primary">tune</span>
                    <span>Filter Criteria</span>
                </div>
                <button type="button" @click="showFilters = false" class="text-on-surface-variant hover:text-on-surface text-[12px] p-1">
                    <span class="material-symbols-outlined text-[16px]">close</span>
                </button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                <!-- Experience -->
                <div>
                    <label for="experience_filter" class="font-data-mono text-[9.5px] text-on-surface-variant uppercase tracking-wider block mb-1 font-semibold">Experience</label>
                    <select id="experience_filter" name="experience_filter" class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl px-2.5 py-1.5 text-[12.5px] text-on-surface focus:border-primary">
                        <option value="all" {% if not experience_filter or experience_filter == 'all' %}selected{% endif %}>All Experience</option>
                        <option value="entry" {% if experience_filter == 'entry' %}selected{% endif %}>Entry Level (0–2 yrs)</option>
                        <option value="mid" {% if experience_filter == 'mid' %}selected{% endif %}>Mid Level (3–5 yrs)</option>
                        <option value="senior" {% if experience_filter == 'senior' %}selected{% endif %}>Senior / Lead (6+ yrs)</option>
                    </select>
                </div>

                <!-- Job Type -->
                <div>
                    <label for="job_type_filter" class="font-data-mono text-[9.5px] text-on-surface-variant uppercase tracking-wider block mb-1 font-semibold">Job Format</label>
                    <select id="job_type_filter" name="job_type_filter" class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl px-2.5 py-1.5 text-[12.5px] text-on-surface focus:border-primary">
                        <option value="all" {% if not job_type_filter or job_type_filter == 'all' %}selected{% endif %}>All Formats</option>
                        <option value="Full-time" {% if job_type_filter == 'Full-time' %}selected{% endif %}>Full-Time</option>
                        <option value="Contract" {% if job_type_filter == 'Contract' %}selected{% endif %}>Contract</option>
                        <option value="Internship" {% if job_type_filter == 'Internship' %}selected{% endif %}>Internship</option>
                    </select>
                </div>

                <!-- Salary -->
                <div>
                    <label for="salary_filter" class="font-data-mono text-[9.5px] text-on-surface-variant uppercase tracking-wider block mb-1 font-semibold">Compensation</label>
                    <select id="salary_filter" name="salary_filter" class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl px-2.5 py-1.5 text-[12.5px] text-on-surface focus:border-primary">
                        <option value="all" {% if not salary_filter or salary_filter == 'all' %}selected{% endif %}>All Compensation</option>
                        <option value="high" {% if salary_filter == 'high' %}selected{% endif %}>₹24L+ / $130k+</option>
                        <option value="mid" {% if salary_filter == 'mid' %}selected{% endif %}>₹14L – ₹24L / $85k–$130k</option>
                        <option value="entry" {% if salary_filter == 'entry' %}selected{% endif %}>Up to ₹14L / $85k</option>
                    </select>
                </div>

                <!-- Sort By -->
                <div>
                    <label for="sort_by" class="font-data-mono text-[9.5px] text-on-surface-variant uppercase tracking-wider block mb-1 font-semibold">Sort Order</label>
                    <select id="sort_by" name="sort_by" class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl px-2.5 py-1.5 text-[12.5px] text-on-surface focus:border-primary">
                        <option value="found_date" {% if not sort_by or sort_by == 'found_date' %}selected{% endif %}>Date Added</option>
                        <option value="relevance_score" {% if sort_by == 'relevance_score' %}selected{% endif %}>AI Match %</option>
                        <option value="title" {% if sort_by == 'title' %}selected{% endif %}>Job Title</option>
                    </select>
                </div>
            </div>

            <!-- Drawer Footer Actions -->
            <div class="flex items-center justify-between pt-2 border-t border-outline-variant/60">
                <a href="{{ url_for('dashboard') }}" class="text-[12px] text-on-surface-variant hover:text-on-surface font-medium">Reset filters</a>
                <button type="submit" class="px-4 py-1.5 bg-primary text-on-primary font-semibold text-[12px] rounded-xl hover:bg-emerald-600 transition-all shadow-xs cursor-pointer">
                    Apply Filters
                </button>
            </div>
        </div>
    </form>

    <!-- Real-time Progress Bar (Only visible when scraping) -->
    <div id="hero-progress-container" class="hidden border border-outline-variant rounded-2xl p-3.5 bg-surface shadow-xs animate-fade-in space-y-2">
        <div class="flex justify-between items-center">
            <span class="font-data-mono text-[11px] text-primary uppercase tracking-wider font-semibold flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-primary animate-ping"></span>
                Agent Scanning Live Portals...
            </span>
            <span id="hero-progress-percentage" class="font-data-mono text-[12px] font-bold text-primary">0%</span>
        </div>
        <div class="w-full bg-surface-container-high rounded-full h-2 overflow-hidden">
            <div id="hero-progress-bar" class="bg-primary h-full rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
        </div>
        <div class="flex justify-between items-center text-[11px] text-on-surface-variant">
            <span id="hero-progress-status" class="font-data-mono">Initializing search worker...</span>
            <span class="font-data-mono text-[10px] text-on-surface-variant/70">Scraping verified job posts</span>
        </div>
        <div id="hero-progress-error" class="hidden text-[11px] text-error bg-error/10 border border-error/30 rounded-xl p-2 font-data-mono"></div>
    </div>
</div>
{% endif %}
