<!-- Daily Inspiration Quote Box (Stitch Precision Spec) -->
<div class="border border-outline-variant rounded-lg bg-surface-container overflow-hidden flex flex-col"
    x-data="{
    quotes: [
        { text: 'The best way to predict the future is to create it.', author: 'Peter Drucker' },
        { text: 'Success is not final, failure is not fatal.', author: 'Winston Churchill' },
        { text: 'Code is poetry written in logic.', author: 'Anonymous' },
        { text: 'Stay hungry, stay foolish.', author: 'Steve Jobs' },
        { text: 'Make it work, make it right, make it fast.', author: 'Kent Beck' },
        { text: 'Talk is cheap. Show me the code.', author: 'Linus Torvalds' },
        { text: 'First solve the problem. Then write the code.', author: 'John Johnson' },
        { text: 'Simplicity is the soul of efficiency.', author: 'Austin Freeman' },
        { text: 'AI amplifies human creativity and ingenuity.', author: 'Fei-Fei Li' },
        { text: 'Software is eating the world.', author: 'Marc Andreessen' },
        { text: 'Focus on being productive, not busy.', author: 'Tim Ferriss' },
        { text: 'Do great work by loving what you do.', author: 'Steve Jobs' }
    ],
    currentQuote: {},
    init() {
        this.pickDailyQuote();
    },
    pickDailyQuote() {
        const today = new Date().toDateString();
        let hash = 0;
        for (let i = 0; i < today.length; i++) {
            hash = ((hash << 5) - hash) + today.charCodeAt(i);
            hash |= 0;
        }
        const index = Math.abs(hash) % this.quotes.length;
        this.currentQuote = this.quotes[index];
    },
    refreshQuote() {
        let newIndex;
        do {
            newIndex = Math.floor(Math.random() * this.quotes.length);
        } while (this.quotes[newIndex].text === this.currentQuote.text && this.quotes.length > 1);
        this.currentQuote = this.quotes[newIndex];
    }
}">

    <div class="px-3 py-2 border-b border-outline-variant flex justify-between items-center bg-surface-container-low">
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-[16px] text-tertiary">bolt</span>
            <span class="font-data-mono text-[10px] text-on-surface-variant uppercase tracking-widest font-semibold">Daily Signal</span>
        </div>
        <button @click="refreshQuote()"
            class="text-on-surface-variant hover:text-primary transition-colors p-1"
            title="New Quote">
            <span class="material-symbols-outlined text-[16px]">sync</span>
        </button>
    </div>

    <div class="p-4 flex-1 flex flex-col justify-center min-h-[120px]">
        <p class="text-[13px] leading-relaxed italic text-on-surface font-body-sm" x-text="'&ldquo;' + currentQuote.text + '&rdquo;'"
            x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0"
            x-transition:enter-end="opacity-100">
        </p>
        <div class="mt-3 flex justify-end">
            <span class="font-data-mono text-[10px] text-on-surface-variant tracking-wider uppercase" x-text="'— ' + currentQuote.author"></span>
        </div>
    </div>
</div>
