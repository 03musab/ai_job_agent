{% extends "base.html" %}
{% block title %}Set Your Password — AI JobSnap{% endblock %}
{% block content %}
<main class="max-w-md mx-auto px-container-padding py-12 flex-1 w-full">
    <section class="border border-outline-variant rounded-xl p-6 bg-surface-container">
        <p class="font-data-mono text-[10px] text-primary uppercase tracking-widest mb-1">Account invitation</p>
        <h1 class="font-headline-lg text-on-surface text-[22px] font-bold">Set your password</h1>
        <p class="font-body-sm text-[13px] text-on-surface-variant mt-2 mb-5">
            Choose a password with at least 12 characters. This invitation link can only be used once.
        </p>
        <form method="POST" class="space-y-4">
            <div>
                <label for="password" class="block text-sm font-medium text-on-surface mb-1">Password</label>
                <input id="password" name="password" type="password" minlength="12" required autocomplete="new-password"
                    class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-3 py-2 text-sm text-on-surface focus:border-primary focus:outline-none">
            </div>
            <div>
                <label for="confirm_password" class="block text-sm font-medium text-on-surface mb-1">Confirm password</label>
                <input id="confirm_password" name="confirm_password" type="password" minlength="12" required autocomplete="new-password"
                    class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-3 py-2 text-sm text-on-surface focus:border-primary focus:outline-none">
            </div>
            <button type="submit" class="w-full bg-primary text-on-primary font-semibold rounded-lg px-4 py-3 hover:opacity-90">
                Save password
            </button>
        </form>
    </section>
</main>
{% endblock %}
