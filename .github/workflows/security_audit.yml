name: "Security Audit Agent"

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Runs daily at 02:00 UTC (automated ongoing security patrol)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  security-patrol:
    name: "Audit Source Code & Dependencies"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Set up Python Environment"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install Security Audit Tooling"
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit pip-audit

      - name: "Run Bandit Code Security Analysis (SAST)"
        run: |
          echo "Scanning source code for vulnerabilities and anti-patterns..."
          bandit -r . -f json -o bandit_results.json --exclude ./node_modules,./tests,./.venv || true

      - name: "Run pip-audit Dependency Vulnerability Scan"
        run: |
          echo "Scanning project requirements for known CVEs..."
          if [ -f "requirements.txt" ]; then
            pip-audit -r requirements.txt -f json -o pip_audit_results.json || true
          else
            pip-audit -f json -o pip_audit_results.json || true
          fi

      - name: "Generate Executive Markdown Report"
        run: |
          python scripts/security_audit_reporter.py

      - name: "Publish Report to GitHub Actions Step Summary"
        run: |
          cat SECURITY_REPORT.md >> $GITHUB_STEP_SUMMARY

      - name: "Upload Security Report as Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: SECURITY_REPORT.md
          retention-days: 30

      - name: "Commit & Push Updated SECURITY_REPORT.md"
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add SECURITY_REPORT.md
          if git diff --staged --quiet; then
            echo "No changes in security audit report to commit."
          else
            git commit -m "chore(security): update automated security audit report [skip ci]"
            git push
          fi

